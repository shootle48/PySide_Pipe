[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipe-inspector"
version = "0.1.0"
description = "Pipe Inspector — PySide6 industrial vision HMI for pipe defect inspection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "minimalmodbus==2.1.1",
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "psutil==7.2.2",
    "pyserial==3.5",
    "PySide6==6.11.1",
    "PySide6_Addons==6.11.1",
    "PySide6_Essentials==6.11.1",
    "scipy==1.17.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pipe-inspector = "pipe_inspector.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets tests `import pipe_inspector` without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",   # long lines tolerated (HMI strings, Thai comments)
    "B905",   # zip() strict= — opinionated; legacy RS485 hardware relies on the default
]
